name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: airouter-proxy-linux-x86_64
          - os: macos-latest
            asset: airouter-proxy-macos-arm64
          - os: windows-latest
            asset: airouter-proxy-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/release -czf "${{ matrix.asset }}.tar.gz" airouter-proxy

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/airouter-proxy.exe -DestinationPath "${{ matrix.asset }}.zip"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: airouter-proxy-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest
